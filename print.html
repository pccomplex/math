<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرياضيات - نسخة للطباعة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl; color: #000; background: #fff;
            line-height: 1.6; font-size: 13px; padding: 10mm;
        }
        h1 { text-align: center; font-size: 20px; margin-bottom: 4px; }
        .subtitle { text-align: center; color: #555; margin-bottom: 15px; font-size: 13px; }
        .topic-block { page-break-inside: avoid; margin-bottom: 20px; }
        .topic-head {
            font-size: 16px; font-weight: bold;
            padding: 8px 14px; background: #e3f2fd;
            border-right: 4px solid #1976d2; border-radius: 4px;
            margin: 20px 0 10px;
        }
        .exercise {
            border: 1px solid #ccc; border-radius: 6px;
            padding: 8px 12px; margin: 8px 0; page-break-inside: avoid;
        }
        .ex-q { font-weight: 500; margin-bottom: 4px; }
        .ex-q .num { font-weight: bold; color: #1976d2; margin-left: 6px; }
        .math { direction: ltr; display: inline-block; unicode-bidi: embed; }
        .math-block { direction: ltr; text-align: center; background: #f5f5f5; padding: 6px; border-radius: 4px; margin: 5px 0; }
        .solution { margin-top: 5px; border-top: 1px dashed #aaa; padding-top: 4px; direction: ltr; text-align: left; font-size: 12px; color: #1b5e20; }
        .sol-label { direction: rtl; text-align: right; font-weight: bold; }
        footer { text-align: center; margin-top: 25px; padding-top: 10px; border-top: 1px solid #ccc; color: #666; font-size: 12px; }
        .print-btn { display: block; margin: 10px auto 20px; padding: 10px 25px; background: #1976d2; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-family: inherit; }
        .toolbar { text-align:center; }
        .toolbar label { font-size: 14px; margin: 0 8px; }
        sub, sup { font-size: 0.75em; }
        @media print {
            .print-btn, .toolbar { display: none; }
            body { padding: 0; }
            @page { margin: 12mm; size: A4; }
        }
    </style>
</head>
<body>
    <button class="print-btn" onclick="window.print()">🖨️ اطبع / احفظ PDF</button>
    <div class="toolbar">
        <label><input type="checkbox" id="chk-solutions" checked onchange="toggleSolutions()"> إظهار الحلول في الطباعة</label>
    </div>
    <h1>الرياضيات — التحضير للصفوف المتقدمة</h1>
    <p class="subtitle">للصف التاسع · تمارين متدرّجة من السهل إلى الصعب</p>
    <div id="content"></div>
    <footer>أُعدّ بواسطة Ibraheem Jaffar · ibraheem.jaffar@protonmail.com</footer>

<script src="data.js"></script>
<script>
function render() {
    const c = document.getElementById('content');
    c.innerHTML = '';
    TOPICS.forEach(t => {
        let html = `<div class="topic-block"><div class="topic-head">${t.emoji} ${t.name}</div>`;
        t.exercises.forEach((ex, i) => {
            const mathHtml = ex.m ? `<div class="math-block">${ex.m}</div>` : '';
            html += `<div class="exercise">
                <div class="ex-q"><span class="num">${i+1}.</span> ${ex.q}</div>
                ${mathHtml}
                <div class="solution"><span class="sol-label">الحل: </span>${ex.a}</div>
            </div>`;
        });
        html += '</div>';
        c.innerHTML += html;
    });
}
function toggleSolutions() {
    const show = document.getElementById('chk-solutions').checked;
    document.querySelectorAll('.solution').forEach(s => s.style.display = show ? 'block' : 'none');
}
render();
</script>
</body>
</html>
