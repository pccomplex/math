<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرياضيات - التحضير للصفوف المتقدمة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg1: #0b1120;
            --bg2: #1e293b;
            --accent: #38bdf8;
            --accent2: #22d3ee;
            --card: #15223b;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            direction: rtl;
            background: radial-gradient(circle at top right, #1e3a5f 0%, var(--bg1) 55%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.7;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        /* ===== HEADER ===== */
        .hero {
            text-align: center;
            padding: 30px 15px 10px;
        }
        .hero h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #38bdf8, #22d3ee, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .hero p { color: var(--muted); font-size: 16px; }
        .hero .badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 16px;
            background: rgba(56,189,248,0.12);
            border: 1px solid rgba(56,189,248,0.3);
            border-radius: 20px;
            color: var(--accent);
            font-size: 14px;
        }

        /* ===== TOPIC CARDS ===== */
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
            margin: 30px 0;
        }
        .topic-card {
            background: linear-gradient(145deg, var(--card), #0f1a2e);
            border: 1px solid rgba(148,163,184,0.12);
            border-radius: 18px;
            padding: 24px 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(.2,.8,.2,1);
            position: relative;
            overflow: hidden;
        }
        .topic-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s;
        }
        .topic-card:hover {
            transform: translateY(-6px);
            border-color: rgba(56,189,248,0.4);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        .topic-card:hover::before { transform: scaleX(1); }
        .topic-icon {
            font-size: 36px;
            margin-bottom: 12px;
            display: block;
        }
        .topic-name { font-size: 18px; font-weight: bold; color: var(--text); margin-bottom: 6px; }
        .topic-count { font-size: 13px; color: var(--muted); }
        .topic-arrow { position: absolute; bottom: 18px; left: 20px; color: var(--accent); font-size: 18px; opacity: 0.6; }

        /* ===== EXERCISES PAGE ===== */
        .page-head {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 10px 0 25px;
            flex-wrap: wrap;
        }
        .back-btn {
            background: rgba(148,163,184,0.1);
            border: 1px solid rgba(148,163,184,0.25);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(148,163,184,0.2); }
        .page-title {
            font-size: 24px;
            color: var(--accent);
            display: flex; align-items: center; gap: 10px;
        }
        .progress-wrap { margin-right: auto; display: flex; align-items: center; gap: 10px; }
        .toggle-all {
            background: linear-gradient(90deg, #0ea5e9, #06b6d4);
            color: white; border: none;
            padding: 10px 18px; border-radius: 12px;
            cursor: pointer; font-family: inherit; font-size: 14px;
            transition: all 0.2s;
        }
        .toggle-all:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(14,165,233,0.4); }

        .exercise {
            background: linear-gradient(145deg, var(--card), #0f1a2e);
            border: 1px solid rgba(148,163,184,0.12);
            border-radius: 16px;
            padding: 22px 24px;
            margin: 16px 0;
            position: relative;
            transition: border-color 0.2s;
        }
        .exercise:hover { border-color: rgba(56,189,248,0.25); }
        .ex-num {
            position: absolute;
            top: -14px; right: 22px;
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #0b1120; font-size: 16px;
            box-shadow: 0 4px 12px rgba(56,189,248,0.4);
        }
        .ex-instruction { font-size: 16px; margin: 8px 0 12px; color: var(--text); }
        .math { direction: ltr; display: inline-block; unicode-bidi: embed; font-weight: 500; }
        .math-block {
            direction: ltr; text-align: center;
            background: rgba(2,6,23,0.5);
            padding: 14px; border-radius: 10px;
            margin: 12px 0; font-size: 18px;
            border: 1px solid rgba(148,163,184,0.1);
        }
        table { border-collapse: collapse; width: 100%; margin: 12px 0; }
        th, td { border: 1px solid rgba(148,163,184,0.2); padding: 10px 14px; text-align: center; }
        th { background: rgba(56,189,248,0.1); color: var(--accent2); }
        td { background: rgba(2,6,23,0.3); }
        td.math { direction: ltr; }

        details { margin-top: 14px; border-radius: 12px; overflow: hidden; }
        summary {
            cursor: pointer;
            padding: 12px 18px;
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.25);
            border-radius: 12px;
            color: #4ade80;
            font-weight: bold; font-size: 15px;
            list-style: none; user-select: none;
            transition: all 0.2s;
        }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background: rgba(34,197,94,0.2); }
        details[open] summary { border-radius: 12px 12px 0 0; }
        .solution-body {
            padding: 16px 20px;
            background: rgba(34,197,94,0.06);
            border: 1px solid rgba(34,197,94,0.2);
            border-top: none;
            border-radius: 0 0 12px 12px;
            direction: ltr; text-align: left;
            font-size: 16px; line-height: 2;
        }
        .solution-body .rtl-note { direction: rtl; text-align: right; color: var(--muted); display: block; }

        footer {
            text-align: center; margin: 50px 0 25px; padding: 24px;
            border-top: 1px solid rgba(148,163,184,0.15);
            color: var(--muted); font-size: 14px;
        }
        footer strong { color: var(--accent); }
        footer a { color: var(--accent2); text-decoration: none; }
        .print-link {
            display: inline-block; margin: 10px; padding: 11px 24px;
            background: rgba(168,139,250,0.15);
            border: 1px solid rgba(168,139,250,0.35);
            color: #c4b5fd; border-radius: 12px;
            text-decoration: none; font-size: 15px; transition: all 0.2s;
        }
        .print-link:hover { background: rgba(168,139,250,0.25); transform: translateY(-2px); }
        .hidden { display: none; }
        sub, sup { font-size: 0.72em; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .exercise, .topic-card { animation: fadeIn 0.4s ease backwards; }
    </style>
</head>
<body>
<div class="container">
    <!-- ===== الصفحة الرئيسية ===== -->
    <div id="page-home">
        <div class="hero">
            <h1>🎓 الرياضيات</h1>
            <p>التحضير للصف العاشر ومواصلة التعلّم في 4 و 5 وحدات</p>
            <div class="badge">للصف التاسع · تمارين متدرّجة من السهل إلى الصعب</div>
        </div>
        <div class="topics-grid" id="topics-grid"></div>
        <div style="text-align:center;">
            <a href="print.html" class="print-link">🖨️ نسخة للطباعة (PDF)</a>
        </div>
    </div>

    <!-- ===== صفحة التمارين ===== -->
    <div id="page-topic" class="hidden">
        <div class="page-head">
            <button class="back-btn" onclick="goHome()">⬅ العودة للمواضيع</button>
            <div class="page-title"><span id="topic-emoji"></span> <span id="topic-title"></span></div>
            <div class="progress-wrap">
                <button class="toggle-all" id="toggle-all" onclick="toggleAll()">إظهار كل الحلول 👁️</button>
            </div>
        </div>
        <div id="exercises-container"></div>
    </div>

    <footer>
        أُعدّ بواسطة <strong>Ibraheem Jaffar</strong><br>
        <a href="mailto:ibraheem.jaffar@protonmail.com">ibraheem.jaffar@protonmail.com</a>
    </footer>
</div>
<script src="data.js"></script>
<script>

// ===== الملاحة =====
let currentTopic = null;

function renderHome() {
    const grid = document.getElementById('topics-grid');
    grid.innerHTML = '';
    TOPICS.forEach((t, i) => {
        const card = document.createElement('div');
        card.className = 'topic-card';
        card.style.animationDelay = (i * 0.05) + 's';
        card.onclick = () => openTopic(t.id);
        card.innerHTML = `
            <span class="topic-icon">${t.emoji}</span>
            <div class="topic-name">${t.name}</div>
            <div class="topic-count">${t.exercises.length} تمارين</div>
            <span class="topic-arrow">←</span>`;
        grid.appendChild(card);
    });
}

function openTopic(id) {
    currentTopic = TOPICS.find(t => t.id === id);
    document.getElementById('topic-emoji').textContent = currentTopic.emoji;
    document.getElementById('topic-title').textContent = currentTopic.name;
    const container = document.getElementById('exercises-container');
    container.innerHTML = '';
    currentTopic.exercises.forEach((ex, i) => {
        const el = document.createElement('div');
        el.className = 'exercise';
        el.style.animationDelay = (i * 0.03) + 's';
        const mathHtml = ex.m ? `<div class="math-block">${ex.m}</div>` : '';
        el.innerHTML = `
            <div class="ex-num">${i + 1}</div>
            <div class="ex-instruction">${ex.q}</div>
            ${mathHtml}
            <details>
                <summary>🔍 إظهار الحل</summary>
                <div class="solution-body">${ex.a}</div>
            </details>`;
        container.appendChild(el);
    });
    document.getElementById('toggle-all').textContent = 'إظهار كل الحلول 👁️';
    document.getElementById('page-home').classList.add('hidden');
    document.getElementById('page-topic').classList.remove('hidden');
    window.scrollTo(0, 0);
}

function goHome() {
    document.getElementById('page-topic').classList.add('hidden');
    document.getElementById('page-home').classList.remove('hidden');
    window.scrollTo(0, 0);
}

function toggleAll() {
    const btn = document.getElementById('toggle-all');
    const allDetails = document.querySelectorAll('#exercises-container details');
    const show = btn.textContent.includes('إظهار');
    allDetails.forEach(d => d.open = show);
    btn.textContent = show ? 'إخفاء كل الحلول 🙈' : 'إظهار كل الحلول 👁️';
}

renderHome();
</script>
</body>
</html>
