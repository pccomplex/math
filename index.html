<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בגרות במתמטיקה 5 יח"ל - תרגול</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #eee;
            min-height: 100vh;
        }
        .container { max-width: 950px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; font-size: 26px; margin: 15px 0 5px; color: #64ffda; }
        .subtitle { text-align: center; color: #90a4ae; margin-bottom: 20px; font-size: 15px; }
        h2 { text-align: center; font-size: 22px; margin: 15px 0; color: #80cbc4; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 6px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .btn-exam { background: #00838f; color: white; font-size: 20px; padding: 22px 30px; width: 100%; margin: 10px 0; text-align: right; }
        .btn-exam small { display: block; font-size: 14px; color: #b2dfdb; margin-top: 5px; font-weight: normal; }
        .btn-topic { background: #37474f; color: #e0e0e0; text-align: right; width: 100%; padding: 15px 20px; display: block; margin: 8px 0; border-radius: 10px; font-size: 16px; }
        .btn-topic:hover { background: #455a64; }
        .btn-topic .count { float: left; background: #00838f; padding: 2px 10px; border-radius: 12px; font-size: 13px; }
        .btn-back { background: #546e7a; color: white; margin: 10px 0; }
        .btn-show { background: #43a047; color: white; font-size: 17px; padding: 12px 28px; }
        .btn-nav { background: #0288d1; color: white; font-size: 16px; padding: 10px 24px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <style>
        .q-card {
            background: #1a2c38;
            border-radius: 15px;
            padding: 25px;
            margin: 15px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .q-number { color: #64ffda; font-size: 15px; margin-bottom: 10px; }
        .q-text {
            font-size: 20px;
            line-height: 1.8;
            margin: 15px 0;
        }
        .q-math {
            direction: ltr;
            text-align: center;
            background: #0d1b24;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 20px;
            overflow-x: auto;
        }
        .answer-box {
            background: #1b3a2a;
            border: 2px solid #43a047;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            direction: ltr;
            text-align: center;
            font-size: 20px;
        }
        .answer-label { color: #81c784; direction: rtl; text-align: right; font-size: 15px; margin-bottom: 8px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .q-counter { font-size: 16px; color: #90a4ae; }
        footer {
            text-align: center;
            margin: 40px 0 20px;
            padding: 20px;
            border-top: 1px solid #37474f;
            color: #78909c;
            font-size: 14px;
        }
        footer a { color: #64ffda; text-decoration: none; }
        .level-tabs { text-align: center; margin: 15px 0; }
        .level-tab {
            padding: 8px 20px;
            margin: 4px;
            border: 1px solid #546e7a;
            background: transparent;
            color: #b0bec5;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
        }
        .level-tab.active { background: #00838f; color: white; border-color: #00838f; }
        sub, sup { font-size: 0.7em; }
    </style>

    <!-- דף ראשי -->
    <div id="page-home">
        <h1>📐 בגרות במתמטיקה 5 יחידות</h1>
        <p class="subtitle">תרגול לפי מתכונת משרד החינוך</p>
        <button class="btn btn-exam" onclick="showExam('35571')">
            שאלון 35571 <small>כיתה י"א · חדו"א, סדרות, גיאומטריה, הסתברות</small>
        </button>
        <button class="btn btn-exam" onclick="showExam('35572')">
            שאלון 35572 <small>כיתה י"ב · גיאומטריה אנליטית, וקטורים, מרוכבים, חדו"א מתקדם</small>
        </button>
    </div>

    <!-- דף נושאים -->
    <div id="page-topics" class="hidden">
        <div class="header-bar">
            <button class="btn btn-back" onclick="goHome()">🏠 ראשי</button>
            <h2 id="exam-title"></h2>
        </div>
        <div id="topics-list"></div>
    </div>

    <!-- דף שאלה -->
    <div id="page-question" class="hidden">
        <div class="header-bar">
            <button class="btn btn-back" onclick="backToTopics()">⬅ נושאים</button>
            <h2 id="topic-title"></h2>
        </div>
        <div class="q-card">
            <div class="nav-bar">
                <button class="btn btn-nav" onclick="prevQ()">→ הקודם</button>
                <span class="q-counter"><span id="q-idx">1</span> / <span id="q-total">1</span></span>
                <button class="btn btn-nav" onclick="nextQ()">הבא ←</button>
            </div>
            <div class="q-number" id="q-source"></div>
            <div class="q-text" id="q-text"></div>
            <div class="q-math" id="q-math"></div>
            <div style="text-align:center;">
                <button class="btn btn-show" id="btn-show" onclick="toggleAnswer()">הצג תשובה 👁️</button>
            </div>
            <div class="answer-box hidden" id="answer-box">
                <div class="answer-label">תשובה:</div>
                <div id="answer-content"></div>
            </div>
        </div>
    </div>

    <footer>
        הוכן על ידי <strong>Ibraheem Jaffar</strong><br>
        <a href="mailto:ibraheem.jaffar@protonmail.com">ibraheem.jaffar@protonmail.com</a>
    </footer>
</div>
<script>
// ===== מאגר שאלות =====
const DB = {
    '35571': {
        name: 'שאלון 35571 (י"א)',
        topics: [
            {
                id: 'short', name: 'שאלות קצרות (חובה)',
                questions: [
                    { text: 'פתרו את המשוואה:', math: '2ˣ⁺¹ = 32', answer: 'x = 4' },
                    { text: 'מצאו את תחום ההגדרה של הפונקציה:', math: 'f(x) = √(x − 3)', answer: 'x ≥ 3' },
                    { text: 'פשטו את הביטוי:', math: 'log₂ 8 + log₃ 9', answer: '3 + 2 = 5' },
                    { text: 'נתון משולש ישר-זווית שהיתר בו 10 וניצב אחד 6. מצאו את הניצב השני.', math: 'a² + 6² = 10²', answer: 'a = 8' },
                    { text: 'מצאו את שיפוע הישר העובר דרך הנקודות (1, 2) ו-(4, 11).', math: 'm = (11 − 2)/(4 − 1)', answer: 'm = 3' },
                ]
            },
            {
                id: 'calculus', name: 'חדו"א - חקירת פונקציות ואינטגרלים',
                questions: [
                    { text: 'נתונה הפונקציה. מצאו את הנגזרת:', math: "f(x) = x³ − 3x² + 2", answer: "f'(x) = 3x² − 6x" },
                    { text: 'מצאו את נקודות הקיצון של הפונקציה:', math: 'f(x) = x³ − 3x', answer: 'מקסימום (−1, 2), מינימום (1, −2)' },
                    { text: 'חשבו את האינטגרל:', math: '∫ (3x² + 2x) dx', answer: 'x³ + x² + C' },
                    { text: 'חשבו את השטח הכלוא בין הפונקציה f(x)=x² לציר ה-x בתחום מ-0 עד 3:', math: '∫₀³ x² dx', answer: '9' },
                    { text: 'מצאו את משוואת המשיק לפונקציה f(x)=x² בנקודה שבה x=2:', math: "f'(x) = 2x, f'(2) = 4", answer: 'y = 4x − 4' },
                    { text: 'נתונה הפונקציה. מצאו את תחומי העלייה:', math: 'f(x) = x² − 4x + 1', answer: 'עולה עבור x > 2' },
                ]
            },
            {
                id: 'sequences', name: 'סדרות ואינדוקציה',
                questions: [
                    { text: 'בסדרה חשבונית a₁=3, d=4. מצאו את האיבר ה-10.', math: 'aₙ = a₁ + (n−1)d', answer: 'a₁₀ = 3 + 9·4 = 39' },
                    { text: 'מצאו את סכום 20 האיברים הראשונים של הסדרה החשבונית 2, 5, 8, ...', math: 'Sₙ = n/2 (2a₁ + (n−1)d)', answer: 'S₂₀ = 610' },
                    { text: 'בסדרה הנדסית a₁=2, q=3. מצאו את האיבר ה-5.', math: 'aₙ = a₁·qⁿ⁻¹', answer: 'a₅ = 2·3⁴ = 162' },
                    { text: 'מצאו את סכום הסדרה ההנדסית האינסופית: 8, 4, 2, 1, ...', math: 'S = a₁/(1−q), q=1/2', answer: 'S = 16' },
                    { text: 'הוכיחו באינדוקציה כי סכום n המספרים הטבעיים הראשונים הוא:', math: '1+2+...+n = n(n+1)/2', answer: 'בדיקה n=1: 1=1 ✓, הנחה ל-n, הוכחה ל-n+1' },
                ]
            },
            {
                id: 'geometry', name: 'גיאומטריה וטריגונומטריה במישור',
                questions: [
                    { text: 'במשולש ABC, הזווית A=50° והזווית B=60°. מצאו את הזווית C.', math: 'A + B + C = 180°', answer: 'C = 70°' },
                    { text: 'שני משולשים דומים ביחס דמיון 1:3. שטח הקטן 5 סמ"ר. מצאו את שטח הגדול.', math: 'יחס שטחים = (יחס דמיון)²', answer: '5 · 9 = 45 סמ"ר' },
                    { text: 'במעגל שרדיוסו 5, מצאו את אורך המיתר המרוחק 3 ממרכז המעגל.', math: 'חצי מיתר = √(5² − 3²)', answer: 'מיתר = 8' },
                    { text: 'במשולש ישר-זווית זווית חדה 30° והיתר 12. מצאו את הניצב שמול הזווית.', math: 'sin 30° = a/12', answer: 'a = 6' },
                ]
            },
            {
                id: 'probability', name: 'הסתברות',
                questions: [
                    { text: 'מטילים קובייה הוגנת. מה ההסתברות לקבל מספר זוגי?', math: 'P = 3/6', answer: '1/2' },
                    { text: 'בכד 4 כדורים אדומים ו-6 כחולים. מוציאים כדור. מה ההסתברות שהוא אדום?', math: 'P = 4/10', answer: '2/5' },
                    { text: 'הסתברות מותנית: P(A)=0.5, P(A∩B)=0.2. מצאו P(B|A).', math: 'P(B|A) = P(A∩B)/P(A)', answer: '0.4' },
                    { text: 'ניסוי ברנולי: p=0.3, n=5. מה ההסתברות ל-2 הצלחות?', math: 'C(5,2)·0.3²·0.7³', answer: '≈ 0.3087' },
                ]
            },
        ]
    },
    '35572': {
        name: 'שאלון 35572 (י"ב)',
        topics: [
            {
                id: 'analytic', name: 'גיאומטריה אנליטית',
                questions: [
                    { text: 'מצאו את מרכז ורדיוס המעגל:', math: 'x² + y² − 6x + 4y − 12 = 0', answer: 'מרכז (3, −2), רדיוס 5' },
                    { text: 'מצאו את משוואת המעגל שמרכזו (2, −1) ורדיוסו 4:', math: '(x−a)² + (y−b)² = r²', answer: '(x−2)² + (y+1)² = 16' },
                    { text: 'נתונה הפרבולה y²=8x. מצאו את המוקד.', math: 'y² = 4px, 4p = 8', answer: 'מוקד (2, 0)' },
                    { text: 'מצאו את מוקדי האליפסה:', math: 'x²/25 + y²/9 = 1', answer: 'c=√(25−9)=4, מוקדים (±4, 0)' },
                    { text: 'מצאו את האסימפטוטות של ההיפרבולה:', math: 'x²/9 − y²/16 = 1', answer: 'y = ±(4/3)x' },
                ]
            },
            {
                id: 'vectors', name: 'וקטורים וטריגונומטריה במרחב',
                questions: [
                    { text: 'נתונים הווקטורים u=(1,2,3) ו-v=(2,0,−1). מצאו u·v (מכפלה סקלרית).', math: 'u·v = 1·2 + 2·0 + 3·(−1)', answer: 'u·v = −1' },
                    { text: 'מצאו את אורך הווקטור v=(3, 4, 12).', math: '|v| = √(3² + 4² + 12²)', answer: '|v| = 13' },
                    { text: 'חשבו את נפח הכדור שרדיוסו 3.', math: 'V = (4/3)πr³', answer: 'V = 36π' },
                    { text: 'חשבו את נפח הגליל שרדיוסו 2 וגובהו 5.', math: 'V = πr²h', answer: 'V = 20π' },
                    { text: 'חשבו את נפח החרוט שרדיוסו 3 וגובהו 4.', math: 'V = (1/3)πr²h', answer: 'V = 12π' },
                ]
            },
            {
                id: 'complex', name: 'מספרים מרוכבים',
                questions: [
                    { text: 'חשבו: (2 + 3i) + (1 − i)', math: '(2+1) + (3−1)i', answer: '3 + 2i' },
                    { text: 'חשבו את המכפלה: (1 + i)(2 − i)', math: '2 − i + 2i − i²', answer: '3 + i' },
                    { text: 'מצאו את הערך המוחלט (מודול) של z = 3 + 4i.', math: '|z| = √(3² + 4²)', answer: '|z| = 5' },
                    { text: 'לפי משפט דה-מואבר חשבו:', math: '(cos30° + i·sin30°)³', answer: 'cos90° + i·sin90° = i' },
                    { text: 'פתרו את המשוואה:', math: 'z² = −9', answer: 'z = ±3i' },
                ]
            },
            {
                id: 'adv_calculus', name: 'חדו"א מתקדם (מעריכי ולוגריתמי)',
                questions: [
                    { text: 'מצאו את הנגזרת של הפונקציה:', math: 'f(x) = eˣ · x', answer: "f'(x) = eˣ(x + 1)" },
                    { text: 'מצאו את הנגזרת של הפונקציה:', math: 'f(x) = ln(x² + 1)', answer: "f'(x) = 2x/(x² + 1)" },
                    { text: 'חשבו את האינטגרל:', math: '∫ eˣ dx', answer: 'eˣ + C' },
                    { text: 'בעיית גדילה: אוכלוסייה גדלה לפי N(t)=1000·e^(0.05t). כמה תהיה אחרי t=20?', math: 'N(20) = 1000·e¹', answer: '≈ 2718' },
                    { text: 'מצאו את נקודת הקיצון של:', math: 'f(x) = xe⁻ˣ', answer: "f'(x)=e⁻ˣ(1−x)=0 → מקסימום ב-x=1" },
                    { text: 'פתרו את המשוואה:', math: 'ln(x) = 2', answer: 'x = e² ≈ 7.39' },
                ]
            },
        ]
    }
};

// ===== ניווט ולוגיקה =====
let currentExam = '';
let currentTopic = null;
let currentQIdx = 0;

function showPage(id) {
    document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

function goHome() { showPage('page-home'); }

function showExam(examId) {
    currentExam = examId;
    const exam = DB[examId];
    document.getElementById('exam-title').textContent = exam.name;
    const list = document.getElementById('topics-list');
    list.innerHTML = '';
    exam.topics.forEach((t, i) => {
        list.innerHTML += `<button class="btn btn-topic" onclick="openTopic(${i})">
            ${t.name} <span class="count">${t.questions.length} שאלות</span></button>`;
    });
    showPage('page-topics');
}

function backToTopics() { showExam(currentExam); }

function openTopic(idx) {
    currentTopic = DB[currentExam].topics[idx];
    currentQIdx = 0;
    document.getElementById('topic-title').textContent = currentTopic.name;
    document.getElementById('q-total').textContent = currentTopic.questions.length;
    renderQuestion();
    showPage('page-question');
}

function renderQuestion() {
    const q = currentTopic.questions[currentQIdx];
    document.getElementById('q-idx').textContent = currentQIdx + 1;
    document.getElementById('q-source').textContent = `שאלה ${currentQIdx + 1}`;
    document.getElementById('q-text').textContent = q.text;
    document.getElementById('q-math').innerHTML = q.math || '';
    document.getElementById('q-math').style.display = q.math ? 'block' : 'none';
    document.getElementById('answer-content').innerHTML = q.answer;
    // hide answer by default
    document.getElementById('answer-box').classList.add('hidden');
    document.getElementById('btn-show').textContent = 'הצג תשובה 👁️';
}

function toggleAnswer() {
    const box = document.getElementById('answer-box');
    const btn = document.getElementById('btn-show');
    if (box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        btn.textContent = 'הסתר תשובה 🙈';
    } else {
        box.classList.add('hidden');
        btn.textContent = 'הצג תשובה 👁️';
    }
}

function nextQ() {
    if (currentQIdx < currentTopic.questions.length - 1) {
        currentQIdx++;
        renderQuestion();
    }
}

function prevQ() {
    if (currentQIdx > 0) {
        currentQIdx--;
        renderQuestion();
    }
}
</script>
</body>
</html>
