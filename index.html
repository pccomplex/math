<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בגרות במתמטיקה 5 יח"ל - תרגול</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #eee;
            min-height: 100vh;
        }
        .container { max-width: 950px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; font-size: 26px; margin: 15px 0 5px; color: #64ffda; }
        .subtitle { text-align: center; color: #90a4ae; margin-bottom: 20px; font-size: 15px; }
        h2 { text-align: center; font-size: 22px; margin: 15px 0; color: #80cbc4; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 6px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .btn-exam { background: #00838f; color: white; font-size: 20px; padding: 22px 30px; width: 100%; margin: 10px 0; text-align: right; }
        .btn-exam small { display: block; font-size: 14px; color: #b2dfdb; margin-top: 5px; font-weight: normal; }
        .btn-topic { background: #37474f; color: #e0e0e0; text-align: right; width: 100%; padding: 15px 20px; display: block; margin: 8px 0; border-radius: 10px; font-size: 16px; }
        .btn-topic:hover { background: #455a64; }
        .btn-topic .count { float: left; background: #00838f; padding: 2px 10px; border-radius: 12px; font-size: 13px; }
        .btn-back { background: #546e7a; color: white; margin: 10px 0; }
        .btn-show { background: #43a047; color: white; font-size: 17px; padding: 12px 28px; }
        .btn-nav { background: #0288d1; color: white; font-size: 16px; padding: 10px 24px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <style>
        .q-item {
            background: #1a2c38;
            border-radius: 12px;
            padding: 20px 22px;
            margin: 14px 0;

            border-right: 4px solid #00838f;
        }
        .q-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .q-num {
            background: #00838f;
            color: white;
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 16px;
        }
        .q-body { flex: 1; min-width: 200px; }
        .q-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .q-math {
            direction: ltr;
            text-align: center;
            background: #0d1b24;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 19px;
            overflow-x: auto;

        .btn-show {

            flex-shrink: 0;
        }
        .answer-box {

            border-radius: 8px;
            padding: 14px;
            margin-top: 12px;
            direction: ltr;
            text-align: center;
            font-size: 18px;
        }
        .answer-label { color: #81c784; direction: rtl; text-align: right; font-size: 14px; margin-bottom: 6px; }

            background: transparent;
            color: #b0bec5;

            font-family: inherit;
            font-size: 15px;
        }
        .level-tab.active { background: #00838f; color: white; border-color: #00838f; }
        sub, sup { font-size: 0.7em; }
    </style>

    <!-- דף ראשי -->
    <div id="page-home">

</div>

// ===== ניווט ולוגיקה =====
let currentExam = '';
let currentTopic = null;
let currentQIdx = 0;

function showPage(id) {
    document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

function goHome() { showPage('page-home'); }

function showExam(examId) {
    currentExam = examId;
    const exam = DB[examId];
    document.getElementById('exam-title').textContent = exam.name;
    const list = document.getElementById('topics-list');
    list.innerHTML = '';
    exam.topics.forEach((t, i) => {
        list.innerHTML += `<button class="btn btn-topic" onclick="openTopic(${i})">
            ${t.name} <span class="count">${t.questions.length} שאלות</span></button>`;
    });
    showPage('page-topics');
}

function backToTopics() { showExam(currentExam); }

function openTopic(idx) {
    currentTopic = DB[currentExam].topics[idx];
    document.getElementById('topic-title').textContent = currentTopic.name;
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    currentTopic.questions.forEach((q, i) => {
        const mathHtml = q.math ? `<div class="q-math">${q.math}</div>` : '';
        container.innerHTML += `
            <div class="q-item">
                <div class="q-head">
                    <div class="q-num">${i + 1}</div>
                    <div class="q-body">
                        <div class="q-text">${q.text}</div>
                        ${mathHtml}
                    </div>
                    <button class="btn btn-show" id="btn-show-${i}" onclick="toggleAnswer(${i})">הצג תשובה 👁️</button>
                </div>
                <div class="answer-box hidden" id="answer-box-${i}">
                    <div class="answer-label">תשובה:</div>
                    <div>${q.answer}</div>
                </div>
            </div>`;
    });
    document.getElementById('btn-toggle-all').textContent = 'הצג את כל התשובות 👁️';
    showPage('page-question');
    window.scrollTo(0, 0);
}

function toggleAnswer(i) {
    const box = document.getElementById('answer-box-' + i);
    const btn = document.getElementById('btn-show-' + i);
    if (box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        btn.textContent = 'הסתר 🙈';
    } else {
        box.classList.add('hidden');
        btn.textContent = 'הצג תשובה 👁️';
    }
}

function toggleAllAnswers() {
    const btn = document.getElementById('btn-toggle-all');
    const showAll = btn.textContent.includes('הצג');
    currentTopic.questions.forEach((q, i) => {
        const box = document.getElementById('answer-box-' + i);
        const sbtn = document.getElementById('btn-show-' + i);
        if (showAll) {
            box.classList.remove('hidden');
            sbtn.textContent = 'הסתר 🙈';
        } else {
            box.classList.add('hidden');
            sbtn.textContent = 'הצג תשובה 👁️';
        }
    });
    btn.textContent = showAll ? 'הסתר את כל התשובות 🙈' : 'הצג את כל התשובות 👁️';
}
</script>
