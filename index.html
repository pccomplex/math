<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمارين رياضيات - الصف السابع حتى التاسع</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #eee;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; font-size: 28px; margin: 20px 0; color: #4fc3f7; }
        h2 { text-align: center; font-size: 22px; margin: 15px 0; color: #81d4fa; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 6px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-grade { background: #2196F3; color: white; font-size: 20px; padding: 20px 40px; }
        .btn-topic { background: #37474f; color: #e0e0e0; text-align: right; width: 100%; padding: 15px 20px; display: block; margin: 8px 0; border-radius: 10px; font-size: 16px; }
        .btn-topic:hover { background: #455a64; }
        .btn-level { padding: 15px 30px; font-size: 18px; }
        .btn-easy { background: #4caf50; color: white; }
        .btn-medium { background: #ff9800; color: white; }
        .btn-hard { background: #f44336; color: white; }
        .btn-back { background: #607d8b; color: white; margin: 10px 0; }
        .btn-check { background: #4caf50; color: white; font-size: 18px; padding: 12px 30px; }
        .btn-next { background: #2196F3; color: white; font-size: 18px; padding: 12px 30px; }
        .grade-section { text-align: center; margin: 30px 0; }
        .topics-list { margin: 20px 0; }
        .level-section { text-align: center; margin: 30px 0; }
        .exercise-area {
            background: #1e3a5f;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
        }
        .exercise-question {
            font-size: 24px;
            margin: 20px 0;
            direction: ltr;
            text-align: center;
            color: #fff;
        }
        .exercise-input {
            font-size: 22px;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #4fc3f7;
            background: #0d2137;
            color: #fff;
            text-align: center;
            width: 150px;
            direction: ltr;
        }
        .exercise-input:focus { outline: none; border-color: #81d4fa; }
        .feedback {
            font-size: 20px;
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
        }
        .feedback.correct { background: #1b5e20; color: #a5d6a7; }
        .feedback.wrong { background: #b71c1c; color: #ef9a9a; }
        .score-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #263238;
            padding: 10px 20px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .score-bar span { font-size: 16px; }
        .hidden { display: none; }
        .topic-icon { margin-left: 10px; }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .hint-text {
            font-size: 14px;
            color: #90a4ae;
            margin: 10px 0;
            font-style: italic;
            direction: rtl;
        }
        .btn-yn {
            padding: 12px 30px;
            font-size: 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-yes { background: #4caf50; color: white; }
        .btn-no { background: #f44336; color: white; }
        .solution-steps {
            text-align: right;
            direction: rtl;
            background: #0d2137;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 16px;
            line-height: 2;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- الصفحة الرئيسية -->
    <div id="page-home">
        <h1>📐 تمارين رياضيات</h1>
        <h2>اختر الصف</h2>
        <div class="grade-section">
            <button class="btn btn-grade" onclick="showGrade(7)">الصف السابع</button>
            <button class="btn btn-grade" onclick="showGrade(8)">الصف الثامن</button>
            <button class="btn btn-grade" onclick="showGrade(9)">الصف التاسع</button>
        </div>
    </div>

    <!-- صفحة المواضيع -->
    <div id="page-topics" class="hidden">
        <div class="header-bar">
            <button class="btn btn-back" onclick="goHome()">🏠 الرئيسية</button>
            <h2 id="grade-title"></h2>
        </div>
        <div id="topics-list" class="topics-list"></div>
    </div>

    <!-- صفحة اختيار المستوى -->
    <div id="page-level" class="hidden">
        <div class="header-bar">
            <button class="btn btn-back" onclick="showGrade(currentGrade)">⬅ رجوع</button>
            <h2 id="topic-title"></h2>
        </div>
        <div class="level-section">
            <p style="margin-bottom:20px;font-size:18px;">اختر مستوى الصعوبة:</p>
            <button class="btn btn-level btn-easy" onclick="startExercise('easy')">سهل</button>
            <button class="btn btn-level btn-medium" onclick="startExercise('medium')">متوسط</button>
            <button class="btn btn-level btn-hard" onclick="startExercise('hard')">صعب</button>
        </div>
    </div>

    <!-- صفحة التمارين -->
    <div id="page-exercise" class="hidden">
        <div class="header-bar">
            <button class="btn btn-back" onclick="showLevel()">⬅ رجوع</button>
            <h2 id="exercise-title"></h2>
        </div>
        <div class="score-bar">
            <span>✅ صحيح: <span id="score-correct">0</span></span>
            <span>❌ خطأ: <span id="score-wrong">0</span></span>
            <span>📝 سؤال: <span id="score-current">1</span> / <span id="score-total">10</span></span>
        </div>
        <div class="exercise-area">
            <div id="exercise-question" class="exercise-question"></div>
            <div id="exercise-input-area" style="margin:20px 0;">
                <input type="text" id="answer-input" class="exercise-input" onkeypress="if(event.key==='Enter')checkAnswer()" autocomplete="off">
            </div>
            <div id="exercise-hint" class="hint-text"></div>
            <div style="margin:15px 0;">
                <button class="btn btn-check" onclick="checkAnswer()">تحقق ✓</button>
                <button class="btn btn-next hidden" id="btn-next" onclick="nextQuestion()">التالي ←</button>
            </div>
            <div id="feedback" class="feedback hidden"></div>
            <div id="solution" class="solution-steps hidden"></div>
        </div>
    </div>

    <!-- صفحة النتيجة -->
    <div id="page-result" class="hidden">
        <div class="exercise-area">
            <h2>🏆 النتيجة</h2>
            <p style="font-size:50px;margin:20px 0;" id="result-emoji"></p>
            <p style="font-size:24px;" id="result-text"></p>
            <p style="font-size:18px;margin:10px 0;color:#90a4ae;" id="result-detail"></p>
            <button class="btn btn-check" onclick="startExercise(currentLevel)">أعد المحاولة 🔄</button>
            <button class="btn btn-back" onclick="showGrade(currentGrade)">موضوع آخر</button>
        </div>
    </div>
</div>
<script>
// ===== DATA =====
let currentGrade = 7;
let currentTopic = '';
let currentLevel = 'easy';
let score = { correct: 0, wrong: 0, current: 0, total: 10 };
let currentAnswer = 0;
let answered = false;

const topics = {
    7: [
        { id: 'fractions_add', name: 'جمع وطرح الكسور', icon: '➕' },
        { id: 'fractions_mul', name: 'ضرب وقسمة الكسور', icon: '✖️' },
        { id: 'order_of_ops', name: 'ترتيب العمليات الحسابية', icon: '🔢' },
        { id: 'powers', name: 'القوى (الأسس)', icon: '²' },
        { id: 'square_root', name: 'الجذر التربيعي', icon: '√' },
        { id: 'negative_nums', name: 'الأعداد السالبة - العمليات', icon: '➖' },
        { id: 'algebraic_expr', name: 'التعابير الجبرية والتبسيط', icon: '📝' },
        { id: 'equations_basic', name: 'حل معادلات بسيطة', icon: '⚖️' },
        { id: 'coordinate_sys', name: 'جهاز المحاور - تحديد النقاط', icon: '📍' },
        { id: 'rectangle_area', name: 'محيط ومساحة المستطيل', icon: '▭' },
        { id: 'box_volume', name: 'حجم ومساحة سطح الصندوق', icon: '📦' },
        { id: 'angles', name: 'الزوايا - متجاورة وقودقودية', icon: '📐' },
        { id: 'triangle_area', name: 'مساحة المثلث', icon: '△' },
        { id: 'circle', name: 'محيط الدائرة ومساحتها', icon: '⭕' },
    ],
    8: [
        { id: 'linear_func', name: 'الدالة الخطية y = mx + b', icon: '📈' },
        { id: 'slope', name: 'الميل (الانحدار)', icon: '↗️' },
        { id: 'point_on_line', name: 'هل النقطة على المستقيم؟', icon: '🎯' },
        { id: 'slope_two_points', name: 'حساب الميل من نقطتين', icon: '📏' },
        { id: 'equations_adv', name: 'معادلات - المتغير في الطرفين', icon: '⚖️' },
        { id: 'word_problems', name: 'مسائل كلامية', icon: '📖' },
        { id: 'power_rules', name: 'قوانين القوى', icon: '🔢' },
        { id: 'pythagoras', name: 'نظرية فيثاغورس', icon: '📐' },
        { id: 'parallelogram', name: 'مساحة متوازي الأضلاع والمعين', icon: '◇' },
        { id: 'trapezoid', name: 'مساحة شبه المنحرف', icon: '⏢' },
        { id: 'prism', name: 'المنشور - الحجم والمساحة', icon: '🔺' },
        { id: 'probability', name: 'الاحتمالات', icon: '🎲' },
    ],
    9: [
        { id: 'factoring', name: 'تحليل التعابير الجبرية', icon: '🧩' },
        { id: 'quadratic_eq', name: 'المعادلة التربيعية', icon: '📊' },
        { id: 'systems_eq', name: 'جملة معادلتين', icon: '🔗' },
        { id: 'inequalities', name: 'متراجحات (متباينات)', icon: '≤' },
        { id: 'parabola', name: 'القطع المكافئ (الباربولا)', icon: '🎢' },
        { id: 'similarity', name: 'التشابه', icon: '🔍' },
        { id: 'trigonometry', name: 'مثلثات قائمة الزاوية - sin cos tan', icon: '📐' },
        { id: 'statistics', name: 'الإحصاء', icon: '📊' },
    ]
};

// ===== NAVIGATION =====
function showPage(pageId) {
    document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden'));
    document.getElementById(pageId).classList.remove('hidden');
}

function goHome() { showPage('page-home'); }

function showGrade(grade) {
    currentGrade = grade;
    const gradeNames = {7:'الصف السابع', 8:'الصف الثامن', 9:'الصف التاسع'};
    document.getElementById('grade-title').textContent = gradeNames[grade];
    const list = document.getElementById('topics-list');
    list.innerHTML = '';
    topics[grade].forEach(t => {
        list.innerHTML += `<button class="btn btn-topic" onclick="showLevel('${t.id}')"><span class="topic-icon">${t.icon}</span> ${t.name}</button>`;
    });
    showPage('page-topics');
}

function showLevel(topicId) {
    if (topicId) currentTopic = topicId;
    const allTopics = [...topics[7], ...topics[8], ...topics[9]];
    const t = allTopics.find(x => x.id === currentTopic);
    document.getElementById('topic-title').textContent = t ? t.name : '';
    showPage('page-level');
}

function startExercise(level) {
    currentLevel = level;
    score = { correct: 0, wrong: 0, current: 1, total: 10 };
    updateScore();
    showPage('page-exercise');
    generateQuestion();
}

// ===== EXERCISE LOGIC =====
function updateScore() {
    document.getElementById('score-correct').textContent = score.correct;
    document.getElementById('score-wrong').textContent = score.wrong;
    document.getElementById('score-current').textContent = score.current;
    document.getElementById('score-total').textContent = score.total;
}

function generateQuestion() {
    answered = false;
    document.getElementById('feedback').classList.add('hidden');
    document.getElementById('solution').classList.add('hidden');
    document.getElementById('btn-next').classList.add('hidden');
    document.getElementById('exercise-hint').textContent = '';
    document.getElementById('exercise-input-area').innerHTML = '<input type="text" id="answer-input" class="exercise-input" onkeypress="if(event.key===\'Enter\')checkAnswer()" autocomplete="off">';

    const generators = {
        'fractions_add': genFractionsAdd,
        'fractions_mul': genFractionsMul,
        'order_of_ops': genOrderOfOps,
        'powers': genPowers,
        'square_root': genSquareRoot,
        'negative_nums': genNegativeNums,
        'algebraic_expr': genAlgebraicExpr,
        'equations_basic': genEquationsBasic,
        'rectangle_area': genRectangleArea,
        'box_volume': genBoxVolume,
        'angles': genAngles,
        'triangle_area': genTriangleArea,
        'circle': genCircle,
        'linear_func': genLinearFunc,
        'slope': genSlope,
        'point_on_line': genPointOnLine,
        'slope_two_points': genSlopeTwoPoints,
        'equations_adv': genEquationsAdv,
        'power_rules': genPowerRules,
        'pythagoras': genPythagoras,
        'parallelogram': genParallelogram,
        'trapezoid': genTrapezoid,
        'quadratic_eq': genQuadraticEq,
        'factoring': genFactoring,
        'systems_eq': genSystemsEq,
        'coordinate_sys': genCoordinateSys,
        'probability': genProbability,
        'word_problems': genWordProblems,
    };

    const gen = generators[currentTopic];
    if (gen) {
        gen();
    } else {
        genDefault();
    }
}

function checkAnswer() {
    if (answered) return;
    answered = true;
    const input = document.getElementById('answer-input').value.trim().replace(/\s/g,'');
    const fb = document.getElementById('feedback');
    fb.classList.remove('hidden', 'correct', 'wrong');
    document.getElementById('btn-next').classList.remove('hidden');

    let isCorrect = false;
    if (typeof currentAnswer === 'number') {
        const userNum = parseFloat(input.replace(',','.'));
        isCorrect = Math.abs(userNum - currentAnswer) < 0.01;
    } else if (typeof currentAnswer === 'string') {
        isCorrect = input.toLowerCase() === currentAnswer.toLowerCase();
    } else if (Array.isArray(currentAnswer)) {
        isCorrect = currentAnswer.some(a => input === String(a) || input === a);
    }

    if (isCorrect) {
        fb.classList.add('correct');
        fb.textContent = '✅ أحسنت! إجابة صحيحة';
        score.correct++;
    } else {
        fb.classList.add('wrong');
        fb.textContent = `❌ خطأ. الإجابة الصحيحة: ${currentAnswer}`;
        score.wrong++;
    }
    updateScore();
}

function nextQuestion() {
    score.current++;
    if (score.current > score.total) {
        showResult();
        return;
    }
    updateScore();
    generateQuestion();
}

function showResult() {
    showPage('page-result');
    const pct = Math.round((score.correct / score.total) * 100);
    let emoji = '🌟';
    if (pct >= 90) emoji = '🏆';
    else if (pct >= 70) emoji = '👏';
    else if (pct >= 50) emoji = '💪';
    else emoji = '📚';
    document.getElementById('result-emoji').textContent = emoji;
    document.getElementById('result-text').textContent = `${score.correct} من ${score.total} (${pct}%)`;
    document.getElementById('result-detail').textContent = pct >= 70 ? 'ممتاز! واصل التدريب' : 'حاول مرة أخرى للتحسن';
}

// ===== HELPER FUNCTIONS =====
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while(b) { [a,b] = [b, a%b]; } return a; }
function showQ(html, answer, hint, mode) {
    document.getElementById('exercise-question').innerHTML = html;
    currentAnswer = answer;
    if (hint) document.getElementById('exercise-hint').textContent = hint;
    
    const inputArea = document.getElementById('exercise-input-area');
    if (mode === 'yesno') {
        inputArea.innerHTML = '<button class="btn-yn btn-yes" onclick="submitYesNo(\'نعم\')">نعم ✓</button><button class="btn-yn btn-no" onclick="submitYesNo(\'لا\')">لا ✗</button>';
    } else if (mode === 'slope-type') {
        inputArea.innerHTML = '<button class="btn-yn" style="background:#4caf50;color:white;" onclick="submitYesNo(\'موجب\')">موجب ↗</button><button class="btn-yn" style="background:#f44336;color:white;" onclick="submitYesNo(\'سالب\')">سالب ↘</button><button class="btn-yn" style="background:#607d8b;color:white;" onclick="submitYesNo(\'صفر\')">صفر →</button>';
    } else {
        inputArea.innerHTML = '<input type="text" id="answer-input" class="exercise-input" onkeypress="if(event.key===\'Enter\')checkAnswer()" autocomplete="off">';
        document.getElementById('answer-input').focus();
    }
}

function submitYesNo(val) {
    if (answered) return;
    answered = true;
    const fb = document.getElementById('feedback');
    fb.classList.remove('hidden', 'correct', 'wrong');
    document.getElementById('btn-next').classList.remove('hidden');
    
    if (val === currentAnswer) {
        fb.classList.add('correct');
        fb.textContent = '✅ أحسنت! إجابة صحيحة';
        score.correct++;
    } else {
        fb.classList.add('wrong');
        fb.textContent = '❌ خطأ. الإجابة الصحيحة: ' + currentAnswer;
        score.wrong++;
    }
    updateScore();
}

// ===== GENERATORS =====

function genFractionsAdd() {
    const diff = {easy:10, medium:15, hard:20}[currentLevel];
    let a,b,c,d,answer;
    if (currentLevel === 'easy') {
        d = [2,3,4,5,6,8,10][rand(0,6)];
        a = rand(1, d-1); c = rand(1, d-1);
        const op = rand(0,1) ? '+' : '-';
        if (op === '-' && a < c) [a,c] = [c,a];
        const num = op === '+' ? a+c : a-c;
        const g = gcd(num, d);
        answer = g === d ? String(num/g) : `${num/g}/${d/g}`;
        showQ(`${a}/${d} ${op} ${c}/${d} = ?`, answer, 'المقامات متساوية');
    } else {
        b = [2,3,4,5,6][rand(0,4)];
        d = [2,3,4,5,6][rand(0,4)];
        if (b === d) d = b + 1;
        a = rand(1, b-1); c = rand(1, d-1);
        const op = rand(0,1) ? '+' : '-';
        const lcd = (b*d)/gcd(b,d);
        const num1 = a*(lcd/b); const num2 = c*(lcd/d);
        let resNum = op === '+' ? num1+num2 : num1-num2;
        if (resNum < 0) { resNum = -resNum; }
        const g = gcd(Math.abs(resNum), lcd);
        const fn = resNum/g; const fd = lcd/g;
        answer = fd === 1 ? String(fn) : `${fn}/${fd}`;
        showQ(`${a}/${b} ${op} ${c}/${d} = ?`, answer, 'أوجد المقام المشترك');
    }
}

function genFractionsMul() {
    let a,b,c,d;
    if (currentLevel === 'easy') {
        b = rand(2,6); d = rand(2,6);
        a = rand(1,b-1); c = rand(1,d-1);
        const num = a*c; const den = b*d;
        const g = gcd(num,den);
        const answer = den/g === 1 ? String(num/g) : `${num/g}/${den/g}`;
        showQ(`${a}/${b} × ${c}/${d} = ?`, answer, 'اضرب البسط بالبسط والمقام بالمقام');
    } else {
        b = rand(2,8); d = rand(2,8);
        a = rand(1,b); c = rand(1,d);
        const isDivision = rand(0,1);
        if (isDivision) {
            const num = a*d; const den = b*c;
            const g = gcd(num,den);
            const answer = den/g === 1 ? String(num/g) : `${num/g}/${den/g}`;
            showQ(`${a}/${b} ÷ ${c}/${d} = ?`, answer, 'اقلب الكسر الثاني واضرب');
        } else {
            const num = a*c; const den = b*d;
            const g = gcd(num,den);
            const answer = den/g === 1 ? String(num/g) : `${num/g}/${den/g}`;
            showQ(`${a}/${b} × ${c}/${d} = ?`, answer, 'اضرب البسط بالبسط والمقام بالمقام');
        }
    }
}

function genOrderOfOps() {
    let expr, answer;
    if (currentLevel === 'easy') {
        const a = rand(2,10), b = rand(2,5), c = rand(1,10);
        const op = rand(0,1);
        if (op) { expr = `${a} + ${b} × ${c}`; answer = a + b*c; }
        else { expr = `${a} × ${b} + ${c}`; answer = a*b + c; }
    } else if (currentLevel === 'medium') {
        const a = rand(2,8), b = rand(1,5), c = rand(1,5), d = rand(2,6);
        expr = `(${a} + ${b}) × ${c} - ${d}`; answer = (a+b)*c - d;
    } else {
        const a = rand(2,5), b = rand(1,4), c = rand(2,4);
        expr = `${a}² + ${b} × ${c}`; answer = a*a + b*c;
    }
    showQ(`${expr} = ?`, answer);
}

function genPowers() {
    if (currentLevel === 'easy') {
        const base = rand(2,6), exp = rand(2,3);
        const answer = Math.pow(base, exp);
        showQ(`${base}<sup>${exp}</sup> = ?`, answer);
    } else if (currentLevel === 'medium') {
        const base = rand(2,5), exp = rand(2,4);
        const mult = rand(2,5);
        const answer = mult * Math.pow(base, exp);
        showQ(`${mult} × ${base}<sup>${exp}</sup> = ?`, answer);
    } else {
        const a = rand(2,4), b = rand(2,3);
        const c = rand(1,5);
        const answer = Math.pow(a,b) + c;
        showQ(`${a}<sup>${b}</sup> + ${c} = ?`, answer);
    }
}

function genSquareRoot() {
    const squares = [4,9,16,25,36,49,64,81,100,121,144];
    if (currentLevel === 'easy') {
        const n = squares[rand(0,5)];
        showQ(`√${n} = ?`, Math.sqrt(n));
    } else {
        const n = squares[rand(0,10)];
        const add = rand(1,10);
        const answer = Math.sqrt(n) + add;
        showQ(`√${n} + ${add} = ?`, answer);
    }
}

function genNegativeNums() {
    let a, b, answer, expr;
    if (currentLevel === 'easy') {
        a = rand(-10, 10); b = rand(-10, 10);
        const op = rand(0,1);
        if (op) { expr = `(${a}) + (${b})`; answer = a + b; }
        else { expr = `(${a}) - (${b})`; answer = a - b; }
    } else if (currentLevel === 'medium') {
        a = rand(-8, 8); b = rand(-8, 8);
        expr = `(${a}) × (${b})`; answer = a * b;
    } else {
        a = rand(-5, 5); b = rand(-5, 5); const c = rand(-5, 5);
        expr = `(${a}) + (${b}) × (${c})`;
        answer = a + b * c;
    }
    showQ(`${expr} = ?`, answer);
}

function genAlgebraicExpr() {
    // Simplify: combine like terms
    const a = rand(1,8), b = rand(1,8), c = rand(1,10);
    if (currentLevel === 'easy') {
        const answer = a + b;
        showQ(`${a}x + ${b}x = ?x`, answer, 'كنّس الحدود المتشابهة');
    } else {
        const d = rand(1,5);
        const answer = a + b - d;
        showQ(`${a}x + ${b}x - ${d}x = ?x`, answer, 'كنّس الحدود المتشابهة');
    }
}

function genEquationsBasic() {
    let answer, expr;
    if (currentLevel === 'easy') {
        answer = rand(1, 10);
        const a = rand(2, 6);
        const b = a * answer;
        showQ(`${a}x = ${b}<br>x = ?`, answer);
    } else if (currentLevel === 'medium') {
        answer = rand(1, 10);
        const a = rand(2, 5);
        const b = rand(1, 10);
        const c = a * answer + b;
        showQ(`${a}x + ${b} = ${c}<br>x = ?`, answer);
    } else {
        answer = rand(1, 8);
        const a = rand(2, 4);
        const b = rand(1, 5);
        const c = rand(1, 3);
        const rhs = a*answer + b - c;
        showQ(`${a}x + ${b} - ${c} = ${rhs}<br>x = ?`, answer);
    }
}

function genRectangleArea() {
    const a = rand(3, 15), b = rand(3, 15);
    if (currentLevel === 'easy') {
        const answer = a * b;
        showQ(`مستطيل: الطول=${a} والعرض=${b}<br>المساحة = ?`, answer);
    } else if (currentLevel === 'medium') {
        const answer = 2*(a+b);
        showQ(`مستطيل: الطول=${a} والعرض=${b}<br>المحيط = ?`, answer);
    } else {
        const perimeter = rand(20, 60);
        const side = rand(3, perimeter/2 - 2);
        const other = perimeter/2 - side;
        const answer = side * other;
        showQ(`مستطيل: المحيط=${perimeter} وطول أحد الأضلاع=${side}<br>المساحة = ?`, answer);
    }
}

function genBoxVolume() {
    const a = rand(2,8), b = rand(2,8), c = rand(2,8);
    if (currentLevel === 'easy') {
        showQ(`صندوق: ${a} × ${b} × ${c}<br>الحجم = ?`, a*b*c);
    } else {
        const sa = 2*(a*b + b*c + a*c);
        showQ(`صندوق: ${a} × ${b} × ${c}<br>مساحة السطح = ?`, sa);
    }
}

function genAngles() {
    if (currentLevel === 'easy') {
        const a = rand(30, 150);
        const answer = 180 - a;
        showQ(`زاويتان متجاورتان. إحداهما ${a}°<br>ما قياس الأخرى؟`, answer, 'مجموع الزوايا المتجاورة = 180°');
    } else if (currentLevel === 'medium') {
        const a = rand(20, 80);
        showQ(`زاويتان قودقوديتان. إحداهما ${a}°<br>ما قياس الأخرى؟`, a, 'الزوايا القودقودية متساوية');
    } else {
        const a = rand(40, 80);
        const b = 180 - a;
        const answer = a;
        showQ(`خطان متوازيان وقاطع. زاوية متبادلة = ${a}°<br>ما الزاوية المتبادلة الأخرى؟`, answer, 'الزوايا المتبادلة بين متوازيين متساوية');
    }
}

function genTriangleArea() {
    const base = rand(4, 16), height = rand(3, 12);
    if (currentLevel === 'easy') {
        const answer = (base * height) / 2;
        showQ(`مثلث: القاعدة=${base} والارتفاع=${height}<br>المساحة = ?`, answer);
    } else {
        const a = rand(20,80), b = rand(20, 160-a);
        const c = 180 - a - b;
        showQ(`مثلث: زاويتان ${a}° و ${b}°<br>ما الزاوية الثالثة؟`, c, 'مجموع زوايا المثلث = 180°');
    }
}

function genCircle() {
    const r = rand(2, 12);
    if (currentLevel === 'easy') {
        const answer = Math.round(2 * 3.14 * r * 100) / 100;
        showQ(`دائرة نصف قطرها ${r}<br>المحيط = ? (π≈3.14)`, answer);
    } else {
        const answer = Math.round(3.14 * r * r * 100) / 100;
        showQ(`دائرة نصف قطرها ${r}<br>المساحة = ? (π≈3.14)`, answer);
    }
}

// ===== GRADE 8 GENERATORS =====

function genLinearFunc() {
    const m = rand(-4, 4);
    const b = rand(-5, 5);
    const x = rand(-3, 3);
    const answer = m * x + b;
    const bStr = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
    showQ(`y = ${m}x ${bStr}<br>ما قيمة y عندما x = ${x}؟`, answer);
}

function genSlope() {
    if (currentLevel === 'easy') {
        const m = rand(-5, 5);
        const b = rand(-5, 5);
        const bStr = b >= 0 ? '+ ' + b : '- ' + Math.abs(b);
        showQ(`y = ${m}x ${bStr}<br>What is the slope (m)?`, m);
    } else {
        const m = rand(-4, 4);
        const b = rand(-5, 5);
        const bStr = b >= 0 ? '+ ' + b : '- ' + Math.abs(b);
        let type;
        if (m > 0) type = 'موجب';
        else if (m < 0) type = 'سالب';
        else type = 'صفر';
        const inputArea = 'slope-type';
        showQ(`y = ${m}x ${bStr}<br>m = ${m}`, type, 'حدد نوع الميل', 'slope-type');
    }
}

function genPointOnLine() {
    const m = rand(1, 4), b = rand(-5, 5);
    const x = rand(-3, 4);
    const y = m * x + b;
    const onLine = rand(0,1);
    const testY = onLine ? y : y + rand(1,3);
    const bStr = b >= 0 ? '+ ' + b : '- ' + Math.abs(b);
    const answer = onLine ? 'نعم' : 'لا';
    showQ(`Is the point (${x}, ${testY}) on the line y = ${m}x ${bStr} ?`, answer, 'عوّض x في المعادلة وافحص', 'yesno');
}

function genSlopeTwoPoints() {
    const m = rand(-4, 4);
    const x1 = rand(-3, 2), x2 = x1 + rand(1, 4);
    const y1 = rand(-5, 5), y2 = y1 + m * (x2 - x1);
    showQ(`احسب ميل المستقيم المار بالنقطتين:<br>(${x1}, ${y1}) و (${x2}, ${y2})<br>m = ?`, m, 'm = (y₂-y₁)/(x₂-x₁)');
}

function genEquationsAdv() {
    const answer = rand(-5, 8);
    const a = rand(2, 5), b = rand(1, 8);
    const c = rand(1, 4), d = a*answer + b - c*answer;
    showQ(`${a}x + ${b} = ${c}x + ${d}<br>x = ?`, answer, 'اجمع حدود x في طرف والأعداد في الطرف الآخر');
}

function genPowerRules() {
    if (currentLevel === 'easy') {
        const base = rand(2,5), e1 = rand(1,3), e2 = rand(1,3);
        const answer = e1 + e2;
        showQ(`${base}<sup>${e1}</sup> × ${base}<sup>${e2}</sup> = ${base}<sup>?</sup>`, answer, 'عند الضرب: نجمع الأسس');
    } else if (currentLevel === 'medium') {
        const base = rand(2,5), e1 = rand(3,6), e2 = rand(1, e1-1);
        const answer = e1 - e2;
        showQ(`${base}<sup>${e1}</sup> ÷ ${base}<sup>${e2}</sup> = ${base}<sup>?</sup>`, answer, 'عند القسمة: نطرح الأسس');
    } else {
        const base = rand(2,4), e1 = rand(2,3), e2 = rand(2,3);
        const answer = e1 * e2;
        showQ(`(${base}<sup>${e1}</sup>)<sup>${e2}</sup> = ${base}<sup>?</sup>`, answer, 'أس الأس: نضرب الأسس');
    }
}

function genPythagoras() {
    const triples = [[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15]];
    const t = triples[rand(0, triples.length-1)];
    if (currentLevel === 'easy') {
        showQ(`مثلث قائم الزاوية: الأضلاع ${t[0]} و ${t[1]}<br>الوتر = ?`, t[2], 'c² = a² + b²');
    } else {
        const idx = rand(0,1);
        const other = 1-idx;
        showQ(`مثلث قائم الزاوية: الوتر=${t[2]} وأحد الأضلاع=${t[idx]}<br>الضلع الآخر = ?`, t[other], 'a² = c² - b²');
    }
}

function genParallelogram() {
    const base = rand(4, 15), height = rand(3, 12);
    showQ(`متوازي أضلاع: القاعدة=${base} والارتفاع=${height}<br>المساحة = ?`, base*height, 'المساحة = القاعدة × الارتفاع');
}

function genTrapezoid() {
    const a = rand(4, 12), b = rand(4, 12), h = rand(3, 10);
    const answer = (a + b) * h / 2;
    showQ(`شبه منحرف: القاعدتان ${a} و ${b}، الارتفاع=${h}<br>المساحة = ?`, answer, 'المساحة = (a+b)×h/2');
}

// ===== GRADE 9 GENERATORS =====

function genFactoring() {
    if (currentLevel === 'easy') {
        const a = rand(2,8);
        const b = rand(1,6);
        // ax + ab = a(x+b)
        showQ(`حلّل: ${a}x + ${a*b} = ${a}( ? )<br>ما داخل القوسين؟ (اكتب مثلاً: x+${b})`, `x+${b}`, 'أخرج العامل المشترك');
    } else {
        // (x+a)(x+b) = x² + (a+b)x + ab
        const a = rand(1,6), b = rand(1,6);
        const sum = a+b, prod = a*b;
        showQ(`حلّل: x² + ${sum}x + ${prod}<br>= (x+?)(x+?)<br>اكتب العددين مفصولين بفاصلة`, [`${a},${b}`, `${b},${a}`]);
    }
}

function genQuadraticEq() {
    // x² - (a+b)x + ab = 0 => x=a, x=b
    const a = rand(1,8), b = rand(1,8);
    const sum = a + b, prod = a * b;
    if (currentLevel === 'easy') {
        showQ(`x² - ${sum}x + ${prod} = 0<br>أوجد قيم x (اكتب الأصغر)`, Math.min(a,b));
    } else {
        showQ(`x² - ${sum}x + ${prod} = 0<br>أوجد قيم x (اكتب الأكبر)`, Math.max(a,b));
    }
}

function genSystemsEq() {
    // ax + y = c, x + y = d
    const x = rand(1, 6), y = rand(1, 6);
    const a1 = rand(1,3), b1 = 1;
    const c1 = a1*x + b1*y;
    const a2 = 1, b2 = rand(1,3);
    const c2 = a2*x + b2*y;
    showQ(`جملة معادلتين:<br>${a1}x + y = ${c1}<br>x + ${b2}y = ${c2}<br>أوجد x`, x);
}

function genDefault() {
    // Placeholder for unimplemented topics
    const a = rand(10,99), b = rand(2,9);
    const answer = a + b;
    showQ(`${a} + ${b} = ?`, answer);
}

// coordinate system
function genCoordinateSys() {
    const x = rand(-5,5), y = rand(-5,5);
    let quadrant;
    if (x > 0 && y > 0) quadrant = 1;
    else if (x < 0 && y > 0) quadrant = 2;
    else if (x < 0 && y < 0) quadrant = 3;
    else if (x > 0 && y < 0) quadrant = 4;
    else quadrant = 0;
    showQ(`The point (${x}, ${y}) is in which quadrant?<br>(1 / 2 / 3 / 4)`, quadrant);
}

// probability
function genProbability() {
    const total = rand(6, 20);
    const favorable = rand(1, total-1);
    const g = gcd(favorable, total);
    const answer = `${favorable/g}/${total/g}`;
    showQ(`In a bag: ${total} balls, ${favorable} are red.<br>Probability of picking red = ?`, answer);
}

// word problems
function genWordProblems() {
    const answer = rand(3, 20);
    const mult = rand(2, 4);
    const add = rand(5, 30);
    const total = mult * answer + add;
    showQ(`A number multiplied by ${mult} then added ${add} gives ${total}.<br>What is the number?`, answer);
}
